name: README checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check project files and README headings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_readme.py
